<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A73E8" />
      <stop offset="50%" stop-color="#1557B0" />
      <stop offset="100%" stop-color="#0D47A1" />
    </linearGradient>

    <!-- Heart Gradient (Vibrant Medical Crimson to Coral) -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="50%" stop-color="#E52D27" />
      <stop offset="100%" stop-color="#B31217" />
    </linearGradient>

    <!-- ECG Glow Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="tileShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.25" />
    </filter>
    <filter id="heartShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    <filter id="pulseGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FFFFFF" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- 1. Background Rounded Tile with Safe Margin (x=40, y=40, w=432, h=432, rx=100) -->
  <rect x="40" y="40" width="432" height="432" rx="96" fill="url(#bgGrad)" filter="url(#tileShadow)" />

  <!-- 2. Subtle Inner Ring for Depth -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.18" />

  <!-- 3. Prominent Full Heart Shape centered (Scale and padded) -->
  <g filter="url(#heartShadow)">
    <path d="M 256,380 
             C 246,370 128,272 128,196 
             A 64,64 0 0,1 256,160 
             A 64,64 0 0,1 384,196 
             C 384,272 266,370 256,380 Z" 
          fill="url(#heartGrad)" />
  </g>

  <!-- 4. Heart Highlight Aura -->
  <path d="M 148,190 
           A 46,46 0 0,1 240,165 
           C 220,165 170,175 148,190 Z" 
        fill="#FFFFFF" 
        opacity="0.35" />

  <!-- 5. White Glowing ECG Heartbeat Line across the Center -->
  <path d="M 112,246 
           L 190,246 
           L 214,195 
           L 242,305 
           L 268,205 
           L 288,265 
           L 304,246 
           L 400,246" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#pulseGlow)" />

  <!-- 6. Leading Pulse Dot -->
  <circle cx="268" cy="205" r="7" fill="#FFFFFF" />
</svg>
