<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A73E8" />
      <stop offset="100%" stop-color="#1557B0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>
  
  <!-- Background Rounded Shield / Tile with 12% safe padding margin -->
  <rect x="56" y="56" width="400" height="400" rx="90" fill="url(#medGrad)" filter="url(#shadow)" />
  
  <!-- Subtle Inner Ring -->
  <circle cx="256" cy="256" r="165" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.25" />

  <!-- Medical Cross Base -->
  <g filter="url(#shadow)">
    <!-- Vertical Cross Bar -->
    <rect x="226" y="136" width="60" height="240" rx="30" fill="#ffffff" />
    <!-- Horizontal Cross Bar -->
    <rect x="136" y="226" width="240" height="60" rx="30" fill="#ffffff" />
  </g>

  <!-- ECG Heartbeat Line across the Center -->
  <path d="M 140 256 L 216 256 L 234 206 L 256 308 L 278 222 L 296 256 L 372 256" 
        fill="none" 
        stroke="#1A73E8" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Heart Dot Highlight -->
  <circle cx="256" cy="190" r="13" fill="#EA4335" />
</svg>
