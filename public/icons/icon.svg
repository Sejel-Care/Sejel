<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A73E8" />
      <stop offset="100%" stop-color="#1557B0" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34A853" />
      <stop offset="100%" stop-color="#2D9247" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Background Rounded Shield / Tile -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#medGrad)" filter="url(#shadow)" />
  
  <!-- Subtle Inner Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2" />

  <!-- Medical Cross Base -->
  <g filter="url(#shadow)">
    <!-- Vertical Cross Bar -->
    <rect x="220" y="116" width="72" height="280" rx="36" fill="#ffffff" />
    <!-- Horizontal Cross Bar -->
    <rect x="116" y="220" width="280" height="72" rx="36" fill="#ffffff" />
  </g>

  <!-- ECG Heartbeat Line across the Center -->
  <path d="M 120 256 L 210 256 L 230 200 L 256 320 L 280 220 L 300 256 L 392 256" 
        fill="none" 
        stroke="#1A73E8" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Heart Dot Highlight -->
  <circle cx="256" cy="180" r="14" fill="#EA4335" />
</svg>
