<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1A73E8" />
    <meta name="description" content="تطبيق سِجِل (Sejel) - السجل الصحي الشخصي والعائلي الذكي. إدارة الفحوصات والزيارات والأدوية والقياسات الحيوية دون إنترنت." />
    
    <!-- PWA / Apple Touch Meta -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="سِجِل" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Google Fonts: Cairo, Tajawal, Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />

    <title>سِجِل | Sejel - السجل الصحي الشخصي والعائلي</title>
  </head>
  <body class="h-full bg-[#F8F9FA] dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-cairo antialiased selection:bg-primary-500 selection:text-white transition-colors duration-200">
    <div id="root" class="min-h-full flex flex-col"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // تسجيل Service Worker للعمل دون اتصال
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('[Sejel] ServiceWorker registered with scope:', reg.scope))
            .catch(err => console.log('[Sejel] ServiceWorker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
